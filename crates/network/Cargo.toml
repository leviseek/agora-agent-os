[package]
name = "agentos-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentos-core.workspace = true
agentos-capability-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
tracing.workspace = true
parking_lot.workspace = true
futures.workspace = true

[dependencies.tonic]
version = "0.14"
optional = true

[dependencies.prost]
version = "0.14"
optional = true

[dependencies.tonic-prost]
version = "0.14"
optional = true

[dependencies.libp2p]
version = "0.57"
optional = true
features = ["tokio", "tcp", "noise", "yamux", "mdns", "ping", "identify", "gossipsub", "macros"]

[dependencies.tokio-stream]
version = "0.1"
features = ["net"]

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[features]
default = ["grpc"]
grpc = ["dep:tonic", "dep:prost", "dep:tonic-prost"]
p2p = ["dep:libp2p"]
