[package]
name = "agora-agent-os-desktop"
version = "0.1.0"
edition = "2021"
description = "Agora Agent OS desktop shell (Tauri 2)"
license = "MIT"

# Built as a standalone cargo project on purpose: the desktop shell must not slow down the
# runtime workspace build, and it is excluded from the workspace in /Cargo.toml.

[lib]
name = "agora_agent_os_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true